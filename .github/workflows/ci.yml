name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/OokiGrader.Web/package-lock.json
            tools/openapi-client/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore OokiGrader.slnx

      - name: Install frontend dependencies
        run: npm ci --prefix src/OokiGrader.Web --no-audit --no-fund

      - name: Install OpenAPI generator dependencies
        run: npm ci --prefix tools/openapi-client --no-audit --no-fund

      - name: Build .NET solution
        run: dotnet build OokiGrader.slnx --configuration Release --no-restore

      - name: Test .NET solution
        run: dotnet test OokiGrader.slnx --configuration Release --no-build

      - name: Check frontend types
        run: npm --prefix src/OokiGrader.Web run check

      - name: Test frontend
        run: npm --prefix src/OokiGrader.Web test

      - name: Build frontend
        run: npm --prefix src/OokiGrader.Web run build

      - name: Check generated OpenAPI client drift
        run: npm --prefix src/OokiGrader.Web run api:check
